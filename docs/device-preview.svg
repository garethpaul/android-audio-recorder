<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Android Audio Recorder preview</title>
  <desc id="desc">A phone with the recorder's dark background and single centered record control.</desc>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-opacity=".25"/></filter><style>.t{font-family:Arial,sans-serif}</style></defs>
  <rect width="1200" height="675" fill="#f1f5f9"/>
  <circle cx="1040" cy="110" r="180" fill="#F07547" opacity=".14"/>
  <g filter="url(#shadow)">
    <rect x="125" y="38" width="360" height="600" rx="52" fill="#111827"/>
    <rect x="150" y="88" width="310" height="505" rx="24" fill="#444C58"/>
    <rect x="150" y="88" width="310" height="58" rx="24" fill="#F07547"/>
    <rect x="150" y="122" width="310" height="24" fill="#F07547"/>
    <circle cx="305" cy="356" r="58" fill="#f8fafc" opacity=".96"/>
    <circle cx="305" cy="356" r="34" fill="#ef4444"/>
    <circle cx="305" cy="65" r="6" fill="#475569"/>
  </g>
  <g class="t">
    <text x="620" y="235" fill="#0f172a" font-size="48" font-weight="800">Android Audio Recorder</text>
    <text x="622" y="290" fill="#475569" font-size="22">One centered control, matching the checked-in layout.</text>
    <text x="622" y="350" fill="#64748b" font-size="19">Tap record to begin.</text>
    <text x="622" y="386" fill="#64748b" font-size="19">Stop successfully to reveal playback.</text>
    <text x="622" y="422" fill="#64748b" font-size="19">Background interruptions discard the capture.</text>
  </g>
</svg>
